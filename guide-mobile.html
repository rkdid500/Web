<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인터넷 가이드_모바일</title>
<style>
  :root {
    --accent: #54C4B2;
    --accent-light: #EDFCFA;
    --text-main: #1a1d29;
    --text-sub: #8a8f9c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f4f7f8;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    max-width: 430px;
    background: #f4f7f8;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: #ffffff;
    box-shadow: 0 1px 0 rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .logo img {
    height: 26px;
    display: block;
  }

  .logo .logo-fallback {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .auth-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-text {
    background: none;
    border: none;
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-solid {
    background: #22252e;
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 8px 15px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- guide section ---------- */
  .guide-section {
    padding: 22px 0 32px;
  }

  .guide-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-main);
    padding: 0 16px;
    margin-bottom: 14px;
    letter-spacing: -0.3px;
  }

  .swiper-wrap {
    position: relative;
  }

  .swiper-track {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    padding: 4px 16px 8px;
    scrollbar-width: none;
    cursor: grab;
  }

  .swiper-track::-webkit-scrollbar {
    display: none;
  }

  .swiper-track.dragging {
    cursor: grabbing;
    scroll-snap-type: none;
  }

  .guide-card {
    flex: 0 0 auto;
    width: 46%;
    scroll-snap-align: start;
    border-radius: 18px;
    overflow: hidden;
    line-height: 0;
  }

  .guide-card img {
    width: 100%;
    height: auto;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
</style>
</head>
<body>

<div class="page">

<header class="topbar">
  <div class="logo">
    <img src="images/싹딜 로고2.png" alt="싹딜" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <span class="logo-fallback" style="display:none;">쏙딜</span>
  </div>
  <div class="auth-buttons">
    <button class="btn-text">회원가입</button>
    <button class="btn-solid">로그인</button>
  </div>
</header>

<section class="guide-section">
  <h2 class="guide-title">꼭 알아두면 좋은 인터넷 가이드</h2>

  <div class="swiper-wrap">
    <div class="swiper-track" id="swiperTrack">
      <article class="guide-card">
        <img src="images/인터넷가이드1.png" alt="인터넷 가입 전 꼭 알아야 할 사항">
      </article>

      <article class="guide-card">
        <img src="images/인터넷가이드2.png" alt="나에게 맞는 요금제 찾는 방법">
      </article>

      <article class="guide-card">
        <img src="images/인터넷가이드3.png" alt="인터넷 결합할인 핵심 정리">
      </article>

      <article class="guide-card">
        <img src="images/인터넷가이드4.png" alt="인터넷 가이드 4">
      </article>
    </div>
  </div>
</section>

</div>

<script>
  // 모바일 터치 스와이프는 브라우저가 기본 지원, 마우스 드래그도 지원
  const track = document.getElementById('swiperTrack');
  let isDragging = false;
  let dragStartX = 0;
  let dragStartScroll = 0;

  track.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') return;
    isDragging = true;
    track.classList.add('dragging');
    dragStartX = e.clientX;
    dragStartScroll = track.scrollLeft;
    track.setPointerCapture(e.pointerId);
  });

  track.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
  });

  function endDrag() {
    isDragging = false;
    track.classList.remove('dragging');
  }

  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // 3초마다 자동으로 다음 카드로 이동 (사용자가 스크롤 중이면 잠시 멈춤)
  const AUTO_INTERVAL = 2000;
  let autoTimer = null;

  function cardStep() {
    const card = track.querySelector('.guide-card');
    const gap = parseFloat(getComputedStyle(track).gap) || 12;
    return card.getBoundingClientRect().width + gap;
  }

  function autoAdvance() {
    const maxScroll = track.scrollWidth - track.clientWidth - 1;
    if (track.scrollLeft >= maxScroll) {
      track.scrollTo({ left: 0, behavior: 'smooth' });
    } else {
      track.scrollBy({ left: cardStep(), behavior: 'smooth' });
    }
  }

  function startAuto() {
    stopAuto();
    autoTimer = setInterval(autoAdvance, AUTO_INTERVAL);
  }

  function stopAuto() {
    if (autoTimer) clearInterval(autoTimer);
    autoTimer = null;
  }

  let resumeTimeout = null;
  function pauseAutoTemporarily() {
    stopAuto();
    clearTimeout(resumeTimeout);
    resumeTimeout = setTimeout(startAuto, AUTO_INTERVAL);
  }

  track.addEventListener('pointerdown', pauseAutoTemporarily);
  track.addEventListener('touchstart', pauseAutoTemporarily, { passive: true });
  track.addEventListener('scroll', pauseAutoTemporarily);

  startAuto();
</script>

</body>
</html>
