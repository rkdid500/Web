<!-- 싹딜 메인 배너 아래의 연한 민트 영역에 전체 내용을 붙여넣으세요. -->
<style>
  .sdc-carriers {
    --sdc-navy: #0b2545;
    --sdc-muted: #71859a;
    --sdc-mint: #08c5b0;
    --sdc-mint-dark: #009c8c;
    --sdc-mint-soft: #effbf9;
    --sdc-line: #dce9e7;
    width: 100%;
    padding: 48px 0 54px;
    color: var(--sdc-navy);
    background: #ffffff;
    font-family: inherit;
    word-break: keep-all;
  }
  .sdc-carriers * { box-sizing: border-box; }
  .sdc-carriers__inner { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
  .sdc-carriers__head { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
  .sdc-carriers h2 { margin: 0; font-size: 22px; line-height: 1.35; letter-spacing: -.8px; }
  .sdc-carriers__all { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; color: #66798b; text-decoration: none; font-size: 14px; font-weight: 600; transition: color .2s ease; }
  .sdc-carriers__all:hover { color: var(--sdc-mint-dark); }
  .sdc-carriers__grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
  .sdc-carrier { min-width: 0; min-height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 8px; border: 1px solid #d9e1e7; border-radius: 6px; background: #fff; color: var(--sdc-navy); text-decoration: none; transition: border-color .2s ease, background-color .2s ease; }
  .sdc-carrier:hover { border-color: #83dcd2; background: #f8fffd; }
  .sdc-carrier__logo { height: 45px; display: flex; align-items: center; justify-content: center; color: var(--brand, var(--sdc-navy)); font-size: 23px; font-weight: 950; letter-spacing: -1.4px; white-space: nowrap; }
  .sdc-carrier__logo small { margin-left: 2px; font-size: .62em; font-weight: 900; letter-spacing: -.5px; }
  .sdc-carrier { position: relative; min-width: 0; min-height: 124px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 8px; overflow: hidden; border: 1px solid #d9e1e7; border-radius: 6px; background: #fff; color: var(--sdc-navy); text-decoration: none; box-shadow: 0 5px 14px rgba(11,37,69,.025); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .sdc-carrier::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--brand, var(--sdc-mint)); transform: scaleX(0); transform-origin: center; transition: transform .2s ease; }
  .sdc-carrier:hover { z-index: 2; transform: translateY(-5px); border-color: var(--brand, var(--sdc-mint)); background-color: #fff; box-shadow: 0 14px 28px rgba(11,37,69,.11); }
  .sdc-carrier:hover::before { transform: scaleX(1); }
  .sdc-carrier__logo { display: block; width: 112px; height: 45px; object-fit: contain; object-position: center; }
  .sdc-carrier--kt .sdc-carrier__logo { width: 78px; height: 48px; }
  .sdc-carrier--lgu .sdc-carrier__logo { width: 118px; height: 42px; }
  .sdc-carrier--skt .sdc-carrier__logo { width: 78px; height: 50px; }
  .sdc-carrier--sky .sdc-carrier__logo { width: 120px; height: 40px; }
  .sdc-carrier--hello .sdc-carrier__logo { width: 126px; height: 38px; }
  .sdc-carrier--skb .sdc-carrier__logo { width: 64px; height: 50px; }
  .sdc-carrier__name { margin-top: 8px; font-size: 14px; font-weight: 500; text-align: center; }
  .sdc-carrier--kt { --brand: #4b4f52; }.sdc-carrier--kt .sdc-carrier__logo::after { content: "+"; color: #ef3340; margin-left: -4px; transform: rotate(18deg); }
  .sdc-carrier--lgu { --brand: #a50034; }.sdc-carrier--lgu .sdc-carrier__logo { letter-spacing: -2px; }
  .sdc-carrier--skt { --brand: #e6332a; }.sdc-carrier--skt .sdc-carrier__logo small { color: #f07b19; }
  .sdc-carrier--kt { --brand: #4b4f52; }
  .sdc-carrier--lgu { --brand: #a50034; }
  .sdc-carrier--skt { --brand: #e6332a; }
  .sdc-carrier--sky { --brand: #e13037; }.sdc-carrier--hello { --brand: #8d2457; }
  .sdc-carrier--skb { --brand: #4c25d5; }.sdc-carrier--skb .sdc-carrier__logo { font-size: 35px; }
  @media (max-width: 980px) {
    .sdc-carriers__grid { display: flex; gap: 12px; overflow-x: auto; padding: 1px 1px 14px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .sdc-carriers__grid::-webkit-scrollbar { display: none; }
    .sdc-carrier { min-width: 128px; scroll-snap-align: start; }
  }
  @media (max-width: 560px) {
    .sdc-carriers { padding: 36px 0 42px; }
    .sdc-carriers__inner { width: min(100% - 28px, 480px); }
    .sdc-carriers__head { margin-bottom: 20px; }
    .sdc-carriers h2 { font-size: 19px; }
    .sdc-carriers__all { font-size: 13px; }
  }
</style>
<section class="sdc-carriers" aria-labelledby="sdc-carriers-title">
  <div class="sdc-carriers__inner">
    <div class="sdc-carriers__head">
      <h2 id="sdc-carriers-title">통신사별 요금제 살펴보기</h2>
      <a class="sdc-carriers__all" href="/internet">더보기 <span aria-hidden="true">〉</span></a>
    </div>
    <!-- 아래 src 경로를 실제 업로드한 통신사 로고 이미지 주소로 교체하세요. -->
    <div class="sdc-carriers__grid">
      <a class="sdc-carrier sdc-carrier--kt" href="/internet?carrier=KT&amp;speed=500&amp;bundle=internet" aria-label="KT 인터넷 보기">
        <img class="sdc-carrier__logo" src="./images/kt-ci.png" alt="KT 로고"><span class="sdc-carrier__name">KT</span>
      </a>
      <a class="sdc-carrier sdc-carrier--lgu" href="/internet?carrier=LGU%2B&amp;speed=500&amp;bundle=internet" aria-label="LG U+ 인터넷 보기">
        <img class="sdc-carrier__logo" src="./images/LG CI.png" alt="LG U+ 로고"><span class="sdc-carrier__name">LG U+</span>
      </a>
      <a class="sdc-carrier sdc-carrier--skt" href="/internet?carrier=SKT&amp;speed=500&amp;bundle=internet" aria-label="SK 인터넷 보기">
        <img class="sdc-carrier__logo" src="./images/SK CI.png" alt="SK 로고"><span class="sdc-carrier__name">SK</span>
      </a>
      <a class="sdc-carrier sdc-carrier--sky" href="/internet?carrier=skylife&amp;speed=500&amp;bundle=internet" aria-label="스카이라이프 인터넷 보기">
        <img class="sdc-carrier__logo" src="./images/skylife2.png" alt="스카이라이프 로고"><span class="sdc-carrier__name">스카이라이프</span>
      </a>
      <a class="sdc-carrier sdc-carrier--hello" href="/internet?carrier=hellovision&amp;speed=500&amp;bundle=internet" aria-label="LG헬로비전 인터넷 보기">
        <img class="sdc-carrier__logo" src="./images/lg_hellovision.png" alt="LG헬로비전 로고"><span class="sdc-carrier__name">LG헬로비전</span>
      </a>
      <a class="sdc-carrier sdc-carrier--skb" href="/internet?carrier=skbSaving&amp;speed=500&amp;bundle=internet" aria-label="SKB 알뜰 인터넷 보기">
        <img class="sdc-carrier__logo" src="./images/skbsaving.png" alt="SKB 알뜰 로고"><span class="sdc-carrier__name">SKB 알뜰</span>
      </a>
    </div>
  </div>
</section>
